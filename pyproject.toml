[build-system]
requires = ['setuptools>=77', 'Cython>=3.3.0', 'numpy>=2.1.3']
build-backend = 'setuptools.build_meta'

[project]
name = 'pykonal'
dynamic = ['version']
description = 'Solve the Eikonal equation in 3D Cartesian or spherical coordinates.'
readme = 'README.md'
requires-python = '>=3.11'
authors = [
    {name = 'Robert Pickle (EDT branch)'},
    {name = 'Malcolm C. A. White (original author, versions <0.5)'},
]
license = 'GPL-3.0-only'
license-files = ['LICENSE', 'SCIPY_LICENSE.txt']
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Science/Research',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: Implementation :: CPython',
    'Topic :: Scientific/Engineering :: Physics',
]
dependencies = [
    'h5py',
    'numpy>=2.1.3',
    'scipy>=1.16',
]

[project.optional-dependencies]
tests = ['pytest']
obspy = ['obspy>=1.4']

[project.urls]
Homepage = 'https://github.com/filefolder/PyKonal-EDT'
'Bug Tracker' = 'https://github.com/filefolder/PyKonal-EDT/issues'

[tool.setuptools]
packages = ['pykonal']

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = 'pykonal.__version__.__version__'}